<!DOCTYPE html>
<html lang="en">
<head>
       
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pombe Lab</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #e5e5e5;
            font-family: Georgia, serif;
            color: #24372d;
        }

        .page {
            max-width: 1200px;
            margin: 30px auto;
            padding: 24px;
        }

        /* ---------- TOP SECTION ---------- */

        .hero {
            display: grid;
            grid-template-columns: 1fr;
            min-height: 390px;
            overflow: hidden;
            background: #f4f6f2;
            border: 1px solid rgba(82, 112, 93, 0.16);
            border-radius: 26px;
            box-shadow: 0 8px 24px rgba(44, 66, 51, 0.07);
        }

        .hero-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 52px 40px;
            border-bottom: 1px solid rgba(82, 112, 93, 0.28);
        }

        .eyebrow {
            margin: 0 0 18px;
            color: #6f927b;
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .hero-rule {
            width: 58px;
            height: 3px;
            margin: 0 0 20px;
            border-radius: 99px;
            background: #8fbe9f;
        }

        .hero-description {
            margin: 18px 0 0;
            color: #66766b;
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            letter-spacing: 0.2px;
        }

        .hero-text h1 {
            font-family: Georgia, serif;
            font-size: clamp(60px, 8vw, 105px);
            line-height: 0.9;
            margin: 0 0 24px 0;
            letter-spacing: 4px;
            color: #355b48;
        }

        .hero-text p {
            font-size: 21px;
            font-weight: bold;
            line-height: 1.5;
            margin: 0;
            color: #425d4b;
        }

        /* ---------- NAVIGATION ---------- */

        .navigation {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 24px;
            padding: 34px 10px 20px;
        }

        .nav-button {
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(64, 100, 76, 0.22);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            text-align: center;
            padding: 14px;

            font-size: 19px;
            font-weight: bold;

            text-decoration: none;
            color: #294735;

            box-shadow: 0 5px 12px rgba(42, 67, 49, 0.12);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }

        .nav-icon {
            width: 34px;
            height: 34px;
            color: #52705d;
            flex-shrink: 0;
        }

        .nav-button:hover {
            transform: translateY(-7px);
            box-shadow: 0 12px 22px rgba(42, 67, 49, 0.18);
            border-color: rgba(64, 100, 76, 0.48);
        }

        .research {
            background: #B8D8C0;
        }

        .publications {
            background: #A5CDB1;
        }

        .protocols {
            background: #8FBEA1;
        }

        .calculations {
            background: #78AA8A;
        }

        .lab-members {
            background: #CFE5D4;
        }

        .page-footer-line {
            width: 100%;
            height: 1px;
            margin: 12px auto 0;
            background: linear-gradient(90deg, transparent, rgba(82, 112, 93, 0.3), transparent);
        }

        /* ---------- SMOOTH ENTRANCE ---------- */

        @keyframes gentle-fade-up {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-text {
            animation: gentle-fade-up 800ms ease-out both;
        }

        .navigation .nav-button {
            opacity: 0;
            animation: gentle-fade-up 650ms ease-out forwards;
        }

        .navigation .nav-button:nth-child(1) { animation-delay: 250ms; }
        .navigation .nav-button:nth-child(2) { animation-delay: 400ms; }
        .navigation .nav-button:nth-child(3) { animation-delay: 550ms; }
        .navigation .nav-button:nth-child(4) { animation-delay: 700ms; }
        .navigation .nav-button:nth-child(5) { animation-delay: 850ms; }

        @media (prefers-reduced-motion: reduce) {
            .hero-text,
            .navigation .nav-button {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }

        /* ---------- HOVER SPARKLES ---------- */

        .sparkle-layer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 9999;
        }

        .sparkle {
            position: absolute;
            width: var(--size, 20px);
            height: var(--size, 20px);
            color: var(--sparkle-color, #8FBEA1);
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
            animation: sparkle-burst 1600ms ease-out forwards;
        }

        .sparkle::before,
        .sparkle::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            background: currentColor;
            border-radius: 2px;
            transform: translate(-50%, -50%);
        }

        .sparkle::before {
            width: 22%;
            height: 100%;
        }

        .sparkle::after {
            width: 100%;
            height: 22%;
        }

        @keyframes sparkle-burst {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
            }
            20% { opacity: 1; }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(90deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .sparkle { animation-duration: 1ms; }
        }

        /* ---------- MOBILE ---------- */

        @media (max-width: 700px) {

            .page {
                margin: 10px;
                padding: 10px;
            }

            .hero {
                min-height: 340px;
                border-radius: 20px;
            }

            .hero-text {
                padding: 38px 18px;
            }

            .hero-text h1 {
                font-size: clamp(48px, 12vw, 72px);
                letter-spacing: 2px;
            }

            .hero-text p {
                font-size: 17px;
            }

            .hero-description {
                max-width: 280px;
            }

            .hero {
                grid-template-columns: 1fr;
            }

            .hero-text {
                min-height: 350px;
            }

            .navigation {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
                padding: 24px 2px 16px;
            }

            .nav-button {
                font-size: 15px;
                gap: 8px;
            }

            .nav-icon {
                width: 28px;
                height: 28px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <section class="hero">

            <div class="hero-text">

                <p class="eyebrow">Fission yeast research</p>
                <h1>POMBE LAB</h1>
                <div class="hero-rule" aria-hidden="true"></div>
                <p>DNA repair <span aria-hidden="true">·</span> Meiosis <span aria-hidden="true">·</span> Cell cycle</p>
                <p class="hero-description">Understanding genome maintenance and chromosome biology</p>

            </div>

        </section>


        <nav class="navigation">

            <a href="lab-members.html" class="nav-button lab-members">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M2.8 19c.4-3.2 2.7-5 6.2-5s5.8 1.8 6.2 5"/><path d="M16 5.5a3.2 3.2 0 0 1 0 6.2M17 14.5c2.5.5 3.8 2 4.2 4.5"/></svg>
                <span>Lab members</span>
            </a>

            <a href="our-research.html" class="nav-button research">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6l-5.5 9.2A1.8 1.8 0 0 0 6.1 21h11.8a1.8 1.8 0 0 0 1.6-2.8L14 9V3"/><path d="M8 15h8M10 12h4"/></svg>
                <span>Our research</span>
            </a>

            <a href="publications.html" class="nav-button publications">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3.5h10l4 4V21H5z"/><path d="M15 3.5V8h4M8 12h8M8 15.5h8M8 19h5"/></svg>
                <span>Publications</span>
            </a>

            <a href="protocols-login.html" class="nav-button protocols">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8M9 3v5l-4 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-4-9V3"/><path d="M7.5 15h9"/><path d="M10 11h4"/></svg>
                <span>Protocols</span>
            </a>

            <a href="calculations-login.html" class="nav-button calculations">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M14 11h2M8 15h2M14 15h2M8 18h2M14 18h2"/></svg>
                <span>Calculations</span>
            </a>

        </nav>
        <div class="page-footer-line" aria-hidden="true"></div>

    </main>

    <script>
        (function () {
            const links = document.querySelectorAll('.navigation .nav-button');
            const colors = ['#78AA8A', '#8FBEA1', '#A5CDB1', '#CFE5D4'];

            links.forEach(function (link) {
                link.addEventListener('mouseenter', function () {
                    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

                    const rect = link.getBoundingClientRect();
                    const layer = document.createElement('div');
                    layer.className = 'sparkle-layer';
                    layer.setAttribute('aria-hidden', 'true');

                    for (let i = 0; i < 7; i++) {
                        const sparkle = document.createElement('span');
                        const angle = (Math.PI * 2 * i / 7) + (Math.random() * 0.4);
                        const radius = Math.max(rect.width, rect.height) * 0.52 + Math.random() * 14;
                        sparkle.className = 'sparkle';
                        sparkle.style.left = (rect.left + rect.width / 2) + 'px';
                        sparkle.style.top = (rect.top + rect.height / 2) + 'px';
                        sparkle.style.setProperty('--dx', (Math.cos(angle) * radius) + 'px');
                        sparkle.style.setProperty('--dy', (Math.sin(angle) * radius) + 'px');
                        sparkle.style.setProperty('--size', (5 + Math.random() * 10) + 'px');
                        sparkle.style.setProperty('--sparkle-color', colors[Math.floor(Math.random() * colors.length)]);
                        sparkle.style.animationDelay = (Math.random() * 250) + 'ms';
                        layer.appendChild(sparkle);
                    }

                    document.body.appendChild(layer);
                    window.setTimeout(function () { layer.remove(); }, 2100);
                });
            });
        })();
    </script>

</body>
</html>
