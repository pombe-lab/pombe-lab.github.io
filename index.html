<!DOCTYPE html>
<html lang="en">
<head>
       
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pombe Lab</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #e5e5e5;
            font-family: Georgia, serif;
            color: #000000;
        }

        .page {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
        }

        /* ---------- TOP SECTION ---------- */

        .hero {
            display: grid;
            grid-template-columns: 1fr;
            min-height: 360px;
        }

        .hero-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            border-bottom: 1px solid black;
        }

        .hero-text h1 {
            font-family: Georgia, serif;
            font-size: clamp(60px, 8vw, 105px);
            line-height: 0.9;
            margin: 0 0 40px 0;
            letter-spacing: 2px;
        }

        .hero-text p {
            font-size: 22px;
            font-weight: bold;
            line-height: 1.2;
            margin: 0;
        }

        /* ---------- NAVIGATION ---------- */

        .navigation {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            padding: 25px 5px;
        }

        .nav-button {
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            font-size: 20px;
            font-weight: bold;

            text-decoration: none;
            color: black;

            box-shadow: 0 4px 7px rgba(0,0,0,0.35);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .nav-button:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
        }

        .research {
            background: #B8D8C0;
        }

        .publications {
            background: #A5CDB1;
        }

        .protocols {
            background: #8FBEA1;
        }

        .calculations {
            background: #78AA8A;
        }

        .lab-members {
            background: #CFE5D4;
        }

        /* ---------- SMOOTH ENTRANCE ---------- */

        @keyframes gentle-fade-up {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-text {
            animation: gentle-fade-up 800ms ease-out both;
        }

        .navigation .nav-button {
            opacity: 0;
            animation: gentle-fade-up 650ms ease-out forwards;
        }

        .navigation .nav-button:nth-child(1) { animation-delay: 250ms; }
        .navigation .nav-button:nth-child(2) { animation-delay: 400ms; }
        .navigation .nav-button:nth-child(3) { animation-delay: 550ms; }
        .navigation .nav-button:nth-child(4) { animation-delay: 700ms; }
        .navigation .nav-button:nth-child(5) { animation-delay: 850ms; }

        @media (prefers-reduced-motion: reduce) {
            .hero-text,
            .navigation .nav-button {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }

        /* ---------- CLICK SPARKLES ---------- */

        .sparkle-layer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 9999;
        }

        .sparkle {
            position: absolute;
            width: var(--size, 20px);
            height: var(--size, 20px);
            color: var(--sparkle-color, #8FBEA1);
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
            animation: sparkle-burst 1600ms ease-out forwards;
        }

        .sparkle::before,
        .sparkle::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            background: currentColor;
            border-radius: 2px;
            transform: translate(-50%, -50%);
        }

        .sparkle::before {
            width: 22%;
            height: 100%;
        }

        .sparkle::after {
            width: 100%;
            height: 22%;
        }

        @keyframes sparkle-burst {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
            }
            20% { opacity: 1; }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(90deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .sparkle { animation-duration: 1ms; }
        }

        /* ---------- MOBILE ---------- */

        @media (max-width: 700px) {

            .page {
                margin: 10px;
                padding: 10px;
            }

            .hero {
                grid-template-columns: 1fr;
            }

            .hero-text {
                min-height: 350px;
            }

            .navigation {
                grid-template-columns: repeat(2, 1fr);
            }

            .nav-button {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <section class="hero">

            <div class="hero-text">

                <h1>
                    POMBE<br>
                    LAB
                </h1>

                <p>
                    DNA repair<br>
                    Meiosis<br>
                    Cell cycle
                </p>

            </div>

        </section>


        <nav class="navigation">

            <a href="lab-members.html" class="nav-button lab-members">
                Lab members
            </a>

            <a href="our-research.html" class="nav-button research">
                Our research
            </a>

            <a href="publications.html" class="nav-button publications">
                Publications
            </a>

            <a href="protocols-login.html" class="nav-button protocols">
                Protocols
            </a>

            <a href="calculations-login.html" class="nav-button calculations">
                Calculations
            </a>

        </nav>

    </main>

    <script>
        (function () {
            const links = document.querySelectorAll('.navigation .nav-button');
            const colors = ['#78AA8A', '#8FBEA1', '#A5CDB1', '#CFE5D4', '#ffffff'];

            links.forEach(function (link) {
                link.addEventListener('click', function (event) {
                    if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
                        return;
                    }

                    const destination = link.href;
                    const rect = link.getBoundingClientRect();
                    const originX = rect.left + rect.width / 2;
                    const originY = rect.top + rect.height / 2;
                    const layer = document.createElement('div');
                    layer.className = 'sparkle-layer';
                    layer.setAttribute('aria-hidden', 'true');

                    for (let i = 0; i < 24; i++) {
                        const sparkle = document.createElement('span');
                        const angle = (Math.PI * 2 * i / 24) + (Math.random() * 0.35);
                        const distance = 45 + Math.random() * Math.min(window.innerWidth, window.innerHeight) * 0.42;
                        sparkle.className = 'sparkle';
                        sparkle.style.left = originX + 'px';
                        sparkle.style.top = originY + 'px';
                        sparkle.style.setProperty('--dx', (Math.cos(angle) * distance) + 'px');
                        sparkle.style.setProperty('--dy', (Math.sin(angle) * distance) + 'px');
                        sparkle.style.setProperty('--size', (10 + Math.random() * 20) + 'px');
                        sparkle.style.setProperty('--sparkle-color', colors[Math.floor(Math.random() * colors.length)]);
                        sparkle.style.animationDelay = (Math.random() * 100) + 'ms';
                        layer.appendChild(sparkle);
                    }

                    document.body.appendChild(layer);
                    event.preventDefault();
                    window.setTimeout(function () {
                        window.location.href = destination;
                    }, 420);
                });
            });
        })();
    </script>

</body>
</html>
