    <style>
        * { box-sizing: border-box; }

        :root {
            --page-bg: #e5e5e5;
            --green-dark: #355b48;
            --green-mid: #789581;
            --green-line: #a5cdb1;
            --green-link: #dcebe0;
            --green-link-hover: #c9e0d0;
            --border: #dce5dd;
            --ink: #343a35;
            --muted: #68736b;
        }

        body {
            margin: 0;
            background: var(--page-bg);
            font-family: Lato, Arial, sans-serif;
            color: var(--ink);
        }

        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 34px 34px 60px;
        }

        /* Header matched to the upgraded site pages */
        .page-eyebrow {
            margin: 0 0 10px;
            text-align: center;
            color: var(--green-mid);
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2.2px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-family: Georgia, serif;
            font-size: 44px;
            font-weight: bold;
            color: var(--green-dark);
            letter-spacing: 0.5px;
        }

        .heading-rule {
            width: 64px;
            height: 2px;
            margin: 18px auto 0;
            border: 0;
            border-radius: 2px;
            background: var(--green-line);
        }

        .page-intro {
            margin: 14px auto 38px;
            text-align: center;
            color: #526357;
            font-family: Georgia, serif;
            font-size: 15px;
            line-height: 1.65;
        }

        /* Rounded panels matching the other upgraded pages */
        .content-section {
            padding: 28px 30px 30px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 3px 12px rgba(40, 65, 48, 0.045);
        }

        .content-section + .content-section { margin-top: 26px; }

        .section-title {
            margin: 0 0 24px;
            padding: 0 0 14px;
            border-bottom: 1px solid #dce5dd;
            color: var(--green-dark);
            font-family: Georgia, serif;
            font-size: 27px;
            font-weight: normal;
            line-height: 1.3;
        }

        /* Publications */
        #all-publications {
            max-height: 560px;
            overflow-y: auto;
            padding: 2px 12px 8px 2px;
            scrollbar-color: #b8d2bf #f2f5f1;
            scrollbar-width: thin;
        }

        .publication {
            margin-bottom: 22px;
            padding: 0 0 2px;
        }

        .publication:last-child { margin-bottom: 0; }

        .publication-button {
            position: relative;
            display: block;
            width: 100%;
            padding: 15px 19px;
            overflow: hidden;
            border: 1px solid #d1e3d6;
            border-radius: 12px;
            background: var(--green-link);
            color: #294c3b;
            text-decoration: none;
            font-family: Lato, Arial, sans-serif;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.45;
            box-shadow: 0 2px 5px rgba(40, 65, 48, 0.045);
            transition: transform 220ms ease, background 220ms ease, box-shadow 220ms ease;
            isolation: isolate;
        }

        .publication-button:hover,
        .publication-button:focus-visible {
            background: var(--green-link-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 9px rgba(40, 65, 48, 0.09);
            outline: none;
        }

        /* Tiny, low-opacity glints appear only while hovering a title link */
        .publication-button::before,
        .publication-button::after {
            content: "✦";
            position: absolute;
            z-index: -1;
            color: #fff;
            opacity: 0;
            pointer-events: none;
            font-size: 13px;
            transition: opacity 260ms ease, transform 360ms ease;
        }

        .publication-button::before {
            top: 7px;
            right: 17px;
            transform: scale(.65) rotate(-18deg);
        }

        .publication-button::after {
            right: 39px;
            bottom: 5px;
            font-size: 9px;
            transform: scale(.7) rotate(15deg);
        }

        .publication-button:hover::before,
        .publication-button:hover::after,
        .publication-button:focus-visible::before,
        .publication-button:focus-visible::after {
            opacity: .65;
            transform: scale(1) rotate(0);
        }

        .authors {
            margin: 9px 10px 0;
            color: #4e5750;
            font-size: 14px;
            line-height: 1.6;
        }

        .journal {
            margin: 4px 10px 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
            font-style: italic;
        }

        /* Collapsible member lists */
        .member {
            margin-bottom: 14px;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fff;
        }

        .member:last-child { margin-bottom: 0; }

        .member summary {
            position: relative;
            cursor: pointer;
            list-style: none;
            padding: 15px 20px;
            font-family: Georgia, serif;
            font-size: 19px;
            font-weight: bold;
            line-height: 1.4;
            transition: background 200ms ease, color 200ms ease;
        }

        .member summary::-webkit-details-marker { display: none; }

        .member summary::after {
            content: "+";
            float: right;
            margin-left: 12px;
            color: #567763;
            font-family: Arial, sans-serif;
            font-size: 21px;
            font-weight: normal;
        }

        .member[open] summary::after { content: "−"; }

        .main-member summary {
            background: #d8e7db;
            color: #315442;
        }

        .main-member summary:hover { background: #cbded0; }

        .subsection-member summary {
            background: #52745f;
            color: #ffffff;
        }

        .subsection-member summary:hover { background: #456451; }

        .member-publications { padding: 22px 18px 18px; }
        .member-publications .publication { margin-bottom: 20px; }

        .no-publications {
            margin: 4px 8px 8px;
            color: #68736b;
            font-size: 14px;
            font-style: italic;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 34px;
            color: #52705d;
            text-decoration: none;
            font-size: 15px;
        }

        .back:hover { text-decoration: underline; }

        /* Gentle entrance, consistent with the other upgraded pages */
        @keyframes publications-fade-up {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-eyebrow, h1, .heading-rule, .page-intro {
            animation: publications-fade-up 750ms ease-out both;
        }

        .content-section {
            animation: publications-fade-up 750ms ease-out both;
        }

        .content-section:nth-of-type(1) { animation-delay: 140ms; }
        .content-section:nth-of-type(2) { animation-delay: 260ms; }

        @media (prefers-reduced-motion: reduce) {
            .page-eyebrow, h1, .heading-rule, .page-intro, .content-section {
                animation: none;
                opacity: 1;
                transform: none;
            }
            .publication-button,
            .publication-button::before,
            .publication-button::after,
            .member summary { transition: none; }
        }

        @media (max-width: 700px) {
            .page { padding: 36px 20px 45px; }
            h1 { font-size: 34px; }
            .page-intro { font-size: 15px; margin-bottom: 30px; }
            .content-section { padding: 22px 18px 24px; border-radius: 15px; }
            .section-title { font-size: 24px; margin-bottom: 20px; }
            .publication-button { font-size: 16px; padding: 14px 16px; }
            .authors { font-size: 13px; }
            .journal { font-size: 12px; }
            .member summary { font-size: 17px; padding: 14px 16px; }
            #all-publications { max-height: 560px; }
        }
    </style>
</head>

/* =====================================================
   CREATE PUBLICATION DISPLAY
   ===================================================== */

function createPublication(publication) {

    const container = document.createElement("article");

    container.className = "publication";

    const link =
        publication.link === "#"
            ? "#"
            : publication.link;

    container.innerHTML = `

        <a
            class="publication-button"
            href="${link}"
            target="_blank"
            rel="noopener noreferrer"
        >
            ${publication.title}
        </a>

        <p class="authors">
            ${publication.authors.join("; ")}
        </p>

        <p class="journal">
            ${publication.journal} · ${publication.year}
        </p>

    `;

    return container;
}


/* =====================================================
   ALL PUBLICATIONS
   ===================================================== */

const allPublicationsContainer =
    document.getElementById("all-publications");

publications
    .sort((a, b) => b.year - a.year)
    .forEach(publication => {

        allPublicationsContainer.appendChild(
            createPublication(publication)
        );

    });


/* =====================================================
   PUBLICATIONS BY MEMBER
   ===================================================== */

const membersContainer =
    document.getElementById("members");

members.forEach(member => {

    const details = document.createElement("details");

    details.className =
        member.group === "subsection"
            ? "member subsection-member"
            : "member main-member";


    const summary = document.createElement("summary");

    summary.textContent = member.name;


    const publicationContainer =
        document.createElement("div");

    publicationContainer.className =
        "member-publications";


    const memberPublications =
        publications.filter(publication =>
            publication.members.includes(member.id)
        );


    if (memberPublications.length === 0) {

        publicationContainer.innerHTML = `
            <p class="no-publications">
                No publications yet.
            </p>
        `;

    } else {

        memberPublications
            .sort((a, b) => b.year - a.year)
            .forEach(publication => {

                publicationContainer.appendChild(
                    createPublication(publication)
                );

            });

    }


    details.appendChild(summary);

    details.appendChild(publicationContainer);

    membersContainer.appendChild(details);

});
